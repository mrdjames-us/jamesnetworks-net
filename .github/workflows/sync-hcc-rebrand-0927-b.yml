name: one-shot sync hcc-rebrand-0927 follow-ups
# One-shot: pulls the exact files from the immutable Pages preview deployment
# (287e56c7), verifies every git blob SHA, commits, and deletes itself.
on:
  push:
    branches: [hcc-rebrand-0927]
    paths: ['.github/workflows/sync-hcc-rebrand-0927-b.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hcc-rebrand-0927
      - name: Fetch and verify files
        run: |
          set -euo pipefail
          B=https://287e56c7.jamesnetworks-net.pages.dev
          fetch() { # path url expected-sha
            mkdir -p "$(dirname "$1")"
            curl -sSL --retry 3 "$B$2" -o "$1"
            got=$(git hash-object "$1")
            if [ "$got" != "$3" ]; then echo "SHA mismatch $1: $got != $3"; exit 1; fi
            echo "ok $1 $got"
          }
          fetch ai-consulting-clinton-mo/index.html /ai-consulting-clinton-mo/ 18c64b232e92b856cb00122fe9a67e22d9b51702
          fetch assets/brand/hcc-site.css /assets/brand/hcc-site.css 684bf06207255559180d3390f0597737ec4ea4ca
          fetch book/index.html /book/ c412bc19678912412bd3d96d6b028028c8f5e4d4
          fetch contact/index.html /contact/ 30110351de351b5ec4265dbf7b5a868c03d38f8e
          fetch method/index.html /method/ e7cdf0d32cb2453dee223c9f6ba0d0b6ab75b5d0
          git rm -q .github/workflows/sync-hcc-rebrand-0927-b.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "HCC rebrand follow-ups: noindex /book and /method, towns label list, NAP tap targets, contact JSON-LD image" -m "Files verified by git blob SHA against Pages preview 287e56c7."
          git push origin HEAD:hcc-rebrand-0927
