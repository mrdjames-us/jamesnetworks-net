name: hcc-launch-fix-0927 (one-shot, no deploy)
on:
  push:
    branches: [hcc-rebrand-launch-0927]
    paths: ['.github/workflows/hcc-launch-fix-0927.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/hcc-rebrand-launch-0927'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hcc-rebrand-launch-0927
          fetch-depth: 0
      - name: Rebuild page from f4eb284 plus towns copy fix
        run: |
          set -euo pipefail
          git config user.name mrdjames-us
          git config user.email bigdaddydj@gmail.com
          F=ai-consulting-clinton-mo/index.html
          git show f4eb28459d41:$F > $F
          python3 - <<'PY'
          p = 'ai-consulting-clinton-mo/index.html'
          s = open(p, encoding='utf-8').read()
          old = '      <p>\n        And the shops in between. Close enough when the work is real:\n      </p>'
          new = '      <p>\n        \u2026and the shops in between.\n      </p>\n      <p>\n        Close enough when the work is real:\n      </p>'
          assert s.count(old) == 1
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          PY
          test "$(git hash-object $F)" = c2efcfc52f6bcc3fac0279569556bece8aeed823
          git add $F
          git commit -m 'HCC rebrand launch: restore escaped ampersands in page URLs (page = f4eb284 + towns fix)'
          git rm -q .github/workflows/hcc-launch-fix-0927.yml
          git commit -m 'HCC rebrand launch: remove one-shot helper workflow'
          git diff --stat f4eb28459d41 HEAD
          test "$(git diff --name-only f4eb28459d41 HEAD)" = "$F"
          git push origin HEAD:hcc-rebrand-launch-0927
