# One-shot helper for draft PR #11 (preview branch only). The GitHub connector
# used by the agent cannot push binary files, so this job applies the text
# patch, regenerates the optimized images with tools/optimize-hcc-images.py,
# and commits the result back to this branch. Delete before merging.
name: hcc-followup-0927 (one-shot, PR #11 branch)
on:
  push:
    branches: [fix/ai-agent-friendly-0926]
    paths: [".github/workflows/hcc-followup-0927.yml"]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/ai-agent-friendly-0926'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply text patch and generate images
        run: |
          set -euo pipefail
          test -f tools/hcc-followup-0927.patch || { echo "already applied"; exit 0; }
          pip install --quiet pillow==12.3.0
          git apply --whitespace=nowarn tools/hcc-followup-0927.patch
          python3 tools/optimize-hcc-images.py
          sha256sum assets/hcc-mark.png assets/hcc-hero-atmosphere.webp assets/hcc-desk-still.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q tools/hcc-followup-0927.patch
          git add index.html styles.css cipherladder/index.html flowscout/index.html netnudge/index.html pool/index.html assets/hcc-mark.png assets/hcc-hero-atmosphere.webp assets/hcc-desk-still.webp
          git commit -m "HCC: shrink homepage images (WebP hero/desk, 180px mark) + JN inline canonicals" -m "Generated by tools/optimize-hcc-images.py (Pillow 12.3.0) from the existing PNGs."
          git push origin HEAD:fix/ai-agent-friendly-0926
