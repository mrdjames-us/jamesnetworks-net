name: one-shot sync hcc-rebrand-0927 (P1/P2 css)
# One-shot: pulls hcc-site.css from immutable Pages preview 499b9ac6,
# verifies the git blob SHA, commits, and deletes itself.
on:
  push:
    branches: [hcc-rebrand-0927]
    paths: ['.github/workflows/sync-hcc-rebrand-0927-d.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hcc-rebrand-0927
      - name: Fetch and verify
        run: |
          set -euo pipefail
          curl -sSL --retry 3 https://499b9ac6.jamesnetworks-net.pages.dev/assets/brand/hcc-site.css -o assets/brand/hcc-site.css
          got=$(git hash-object assets/brand/hcc-site.css)
          test "$got" = "1ebc11696a973ced03b7d32c5bc225ab881cdabd" || { echo "SHA mismatch $got"; exit 1; }
          git rm -q .github/workflows/sync-hcc-rebrand-0927-d.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P1/P2 follow-up: About heading fits at 320 (name kept together), phone never wraps, contact list 2x2 at >=768" -m "Verified by git blob SHA against Pages preview 499b9ac6."
          git push origin HEAD:hcc-rebrand-0927
