name: one-shot sync hcc-rebrand-0927 (B3 + review fixes)
# One-shot: removes /book, /method, /contact (+ their redirects, middleware
# prefixes, noindex rules, dead hcc.css), pulls the edited files from the
# immutable Pages preview e6817228, verifies every git blob SHA, commits,
# and deletes itself.
on:
  push:
    branches: [hcc-rebrand-0927]
    paths: ['.github/workflows/sync-hcc-rebrand-0927-c.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hcc-rebrand-0927
          fetch-depth: 0
      - name: Apply and verify
        run: |
          set -euo pipefail
          check() { got=$(git hash-object "$1"); if [ "$got" != "$2" ]; then echo "SHA mismatch $1: $got != $2"; exit 1; fi; echo "ok $1 $got"; }
          B=https://e6817228.jamesnetworks-net.pages.dev
          fetch() { mkdir -p "$(dirname "$1")"; curl -sSL --retry 3 "$B$2" -o "$1"; check "$1" "$3"; }
          fetch index.html / bc58ab678075e17e1d89aebdb8afca6d9c215f94
          fetch faq/index.html /faq/ 3fd9a72f4ee36ce26b9537305286a96d6e52aa75
          fetch sitemap.xml /sitemap.xml 49e3d84fc9a1213cde31166f938b642d1296aace
          fetch assets/brand/hcc-site.css /assets/brand/hcc-site.css 977ce133de9dec67831e8d57210c5ffc4af4f61f
          # _redirects back to main's version (drops the /book, /method, /contact rules from #11/#12)
          git show 761e4a651e25b7140ea36b29861857c9d0453f4a:_redirects > _redirects
          check _redirects 476d0c048625a83433202e7a8df93e857723712f
          # _headers back to the rebrand's first version (drops the /book + /method noindex rules)
          git show 129b17bb299bb7e1782a15500b0108a0e8e49ada:_headers > _headers
          check _headers 2d7703e9dc5b494d8f893ef2933bf4cedf2baff9
          python3 - <<'PY'
          p = "functions/_middleware.js"
          s = open(p, encoding="utf-8").read()
          old = '  "/method",\n  "/book",\n'
          assert s.count(old) == 1, "middleware prefix lines not found exactly once"
          open(p, "w", encoding="utf-8").write(s.replace(old, "", 1))
          PY
          check functions/_middleware.js b1764686e69ba5af27e1a3d335ca564c20de5870
          git rm -rq book method contact hcc.css
          git rm -q .github/workflows/sync-hcc-rebrand-0927-c.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ship only production pages: drop /book, /method, /contact; review fixes B1, B2, P1-P4" -m "Removes the three pages, their _redirects rules, the /method and /book middleware prefixes, the noindex rules and the now-unreferenced hcc.css. Header Book button contrast, FAQ CTA, About heading nbsp, contact-mini nowrap, email wbr, inner H2 40px. Restyled pages are saved on hcc-pages-restyled-0927. Files verified by git blob SHA against Pages preview e6817228."
          git push origin HEAD:hcc-rebrand-0927
